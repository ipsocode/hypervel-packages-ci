name: Suite
description: Code style, PHPStan and the test suite for a package, after the install action. With a minimum coverage the suite runs under the coverage gate.
inputs:
  php:
    description: The PHP version of the job, such as 8.4. It names the coverage artifact.
    required: true
  style:
    description: Run php-cs-fixer in dry-run mode first.
    default: 'false'
  min-coverage:
    description: Run the suite under the coverage gate at this percentage. Empty runs the plain suite.
    default: ''
runs:
  using: composite
  steps:
    - name: Check code style
      if: inputs.style == 'true'
      shell: bash
      run: vendor/bin/php-cs-fixer fix --dry-run --diff

    - name: Run PHPStan
      shell: bash
      run: vendor/bin/phpstan analyse --memory-limit 1G -c phpstan.neon --no-progress

    - name: Run the suite
      if: inputs.min-coverage == ''
      shell: bash
      env:
        OTEL_SDK_DISABLED: 'true'
      run: vendor/bin/testbench package:test --parallel

    - name: Assert a coverage driver is loaded
      if: inputs.min-coverage != ''
      shell: bash
      run: php -m | grep -qx pcov

    - name: Run the suite under the coverage gate
      id: gate
      if: inputs.min-coverage != ''
      shell: bash
      env:
        OTEL_SDK_DISABLED: 'true'
        MIN_COVERAGE: ${{ inputs.min-coverage }}
      run: |
        vendor/bin/testbench package:test --parallel \
          --coverage --min="${MIN_COVERAGE}" --coverage-clover tests/coverage/clover.xml

    - name: Upload the coverage report
      if: ${{ always() && inputs.min-coverage != '' && (github.event_name != 'pull_request' || steps.gate.outcome == 'failure') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: clover-php${{ inputs.php }}
        path: tests/coverage/clover.xml
        if-no-files-found: ignore
        retention-days: 14
