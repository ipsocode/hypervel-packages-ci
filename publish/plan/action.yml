name: Publish plan
description: Decide the version, the tag and whether anything ships, from the latest v* tag and the pull requests merged since. Check the repository out with full history and tags first.
inputs:
  event:
    description: The event that started the workflow. A push means a hand-made tag; anything else is a dispatch.
    default: ${{ github.event_name }}
  ref:
    description: The ref the workflow runs on. A dispatch must run on refs/heads/main.
    default: ${{ github.ref }}
  bump:
    description: auto, patch, minor or major. Ignored when version is given.
    default: auto
  version:
    description: An exact version instead, such as 1.0.0 or 0.2.0-rc.1.
    default: ''
  dry-run:
    description: Plan only; the mode comes out as dry-run.
    default: 'false'
  token:
    description: Token for gh, to list the merged pull requests and releases.
    default: ${{ github.token }}
outputs:
  mode:
    description: tag-and-release, release-existing-tag, already-released or dry-run.
    value: ${{ steps.plan.outputs.mode }}
  tag:
    value: ${{ steps.plan.outputs.tag }}
  sha:
    value: ${{ steps.plan.outputs.sha }}
  previous:
    value: ${{ steps.plan.outputs.previous }}
  breaking:
    value: ${{ steps.plan.outputs.breaking }}
  features:
    value: ${{ steps.plan.outputs.features }}
runs:
  using: composite
  steps:
    - name: Decide the version
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ inputs.event }}
        REF: ${{ inputs.ref }}
        BUMP: ${{ inputs.bump }}
        VERSION: ${{ inputs.version }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        baseline() {
          git tag --list 'v*' --merged "$1" --sort=-v:refname | grep -vx "${2:-}" | head -n 1 || true
        }

        labelled_since() {
          local label="$1" previous="$2" sha="$3" found='' merge_sha number merged
          merged=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --base main --limit 200 \
                     --json number,mergeCommit,labels \
                     --jq ".[] | select(any(.labels[]; .name == \"${label}\")) | \"\(.mergeCommit.oid) \(.number)\"") || {
            echo "::error::Could not list the merged pull requests labelled ${label}. The token needs pull-requests: read; a version planned without the list could be a patch where a minor is due." >&2
            exit 1
          }
          while read -r merge_sha number; do
            [ -n "${merge_sha}" ] || continue
            git cat-file -e "${merge_sha}^{commit}" 2> /dev/null || continue
            git merge-base --is-ancestor "${merge_sha}" "${sha}" || continue
            if [ -n "${previous}" ] && git merge-base --is-ancestor "${merge_sha}" "${previous}^{commit}"; then
              continue
            fi
            found="${found:+${found} }#${number}"
          done <<< "${merged}"
          echo "${found}"
        }

        ships_since() {
          local previous="$1" sha="$2" dir
          [ -n "${previous}" ] || return 0
          dir=$(mktemp -d)
          mkdir "${dir}/previous" "${dir}/next"
          git archive "${previous}^{commit}" | tar -x -C "${dir}/previous"
          git archive "${sha}" | tar -x -C "${dir}/next"
          if diff -rq "${dir}/previous" "${dir}/next" > /dev/null; then
            return 1
          fi
        }

        same_minor_line() {
          local a="${1#v}" b="${2#v}"
          a="${a%%-*}"; b="${b%%-*}"
          [ "${a%.*}" = "${b%.*}" ]
        }

        next_minor() {
          local base="${1#v}" major minor patch
          base="${base%%-*}"
          IFS=. read -r major minor patch <<< "${base}"
          echo "v${major}.$((minor + 1)).0"
        }

        if [ "${EVENT}" = "push" ]; then
          tag="${GITHUB_REF_NAME}"
          sha=$(git rev-parse "${tag}^{commit}")

          git merge-base --is-ancestor "${sha}" origin/main || {
            echo "::error::${tag} points at ${sha}, which is not on main. Releases are cut from main only."
            exit 1
          }

          previous=$(baseline "${sha}" "${tag}")
          breaking=$(labelled_since breaking-change "${previous}" "${sha}")
          features=$(labelled_since enhancement "${previous}" "${sha}")
          bump='(hand-made tag)'

          if [ -n "${breaking}" ] && [ -n "${previous}" ] && same_minor_line "${tag}" "${previous}"; then
            echo "::error::${tag} is only a patch above ${previous}, but pull requests merged since then are labelled breaking-change (${breaking}). A breaking change needs at least a minor bump — delete this tag and dispatch the workflow with bump=auto or minor, which gives $(next_minor "${previous}")."
            exit 1
          fi
          if [ -n "${features}" ] && [ -n "${previous}" ] && same_minor_line "${tag}" "${previous}"; then
            echo "::error::${tag} is only a patch above ${previous}, but pull requests merged since then are labelled enhancement (${features}). A feature ships in a minor release — delete this tag and dispatch the workflow with bump=auto or minor, which gives $(next_minor "${previous}")."
            exit 1
          fi

          if gh release view "${tag}" --json tagName > /dev/null 2>&1; then
            echo "::notice::${tag} already has a Release; nothing to do."
            mode='already-released'
          else
            mode='release-existing-tag'
            if ! ships_since "${previous}" "${sha}"; then
              echo "::error::${tag} ships nothing that ${previous} did not: the release archives of the two commits are identical. Delete this tag; the next release waits for a change that ships."
              exit 1
            fi
          fi
        else
          [ "${REF}" = "refs/heads/main" ] || {
            echo "::error::Run this workflow on main — it was dispatched on ${REF}."
            exit 1
          }
          sha="${GITHUB_SHA}"
          previous=$(baseline "${sha}")
          breaking=$(labelled_since breaking-change "${previous}" "${sha}")
          features=$(labelled_since enhancement "${previous}" "${sha}")

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -n "${VERSION}" ]; then
            version="${VERSION#v}"
            [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
              echo "::error::'${VERSION}' is not a version. Use MAJOR.MINOR.PATCH with an optional pre-release suffix, e.g. 1.0.0 or 0.2.0-rc.1."
              exit 1
            }
            bump='(explicit version)'
          else
            base="${latest#v}"; base="${base%%-*}"; base="${base:-0.0.0}"
            IFS=. read -r major minor patch <<< "${base}"
            bump="${BUMP}"
            if [ "${bump}" = "auto" ]; then
              if [ -n "${breaking}${features}" ]; then bump='auto → minor'; else bump='auto → patch'; fi
            fi
            case "${bump##* }" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="${major}.$((minor + 1)).0" ;;
              patch) version="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::unknown bump '${BUMP}'"; exit 1 ;;
            esac
          fi
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "::error::${tag} already exists (at $(git rev-parse --short "${tag}^{commit}"))."
            exit 1
          fi
          if [ -n "${latest}" ] && [ "$(printf '%s\n' "${latest}" "${tag}" | sort -V | tail -n 1)" != "${tag}" ]; then
            echo "::error::${tag} is not above the latest tag ${latest}. Releases only move forward."
            exit 1
          fi
          if [ -n "${breaking}" ] && [ -n "${previous}" ] && same_minor_line "${tag}" "${previous}"; then
            echo "::error::${tag} is only a patch above ${previous}, but pull requests merged since then are labelled breaking-change (${breaking}). A breaking change needs at least a minor bump — use bump=auto or minor (gives $(next_minor "${previous}")), or a version at least that high."
            exit 1
          fi
          if [ -n "${features}" ] && [ -n "${previous}" ] && same_minor_line "${tag}" "${previous}"; then
            echo "::error::${tag} is only a patch above ${previous}, but pull requests merged since then are labelled enhancement (${features}). A feature ships in a minor release — use bump=auto or minor (gives $(next_minor "${previous}")), or a version at least that high."
            exit 1
          fi
          if ! ships_since "${previous}" "${sha}"; then
            echo "::error::Nothing ships since ${previous}: the release archives of ${previous} and ${sha} are identical, so a new tag would publish the same package again."
            exit 1
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            mode='dry-run'
          else
            mode='tag-and-release'
          fi
        fi

        {
          echo "mode=${mode}"
          echo "tag=${tag}"
          echo "sha=${sha}"
          echo "previous=${previous}"
          echo "breaking=${breaking}"
          echo "features=${features}"
        } >> "${GITHUB_OUTPUT}"

        {
          echo "## Release plan"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Mode | \`${mode}\` |"
          echo "| Tag | \`${tag}\` |"
          echo "| Bump | \`${bump}\` |"
          echo "| Commit | \`${sha}\` — $(git log -1 --format=%s "${sha}") |"
          echo "| Notes since | \`${previous:-(first release)}\` |"
          echo "| Breaking changes | ${breaking:-none} |"
          echo "| Features | ${features:-none} |"
        } >> "${GITHUB_STEP_SUMMARY}"
