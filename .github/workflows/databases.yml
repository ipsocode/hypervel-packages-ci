# The MySQL, MariaDB, PostgreSQL and SQLite jobs of hypervel/components' .github/workflows/databases.yml,
# branch 0.4, at e44bad61bfd91a0f68eacbfdbc9d871f56cbb100, as a reusable workflow for the packages that run
# their suite against real databases. Compare the two when upstream changes a version, and change it here once.
# The CI image differs on purpose, and so does the Composer step (a package has no lockfile).
# The calling package's testbench.yaml sets OTEL_SDK_DISABLED: true; nothing here does. phpunit.xml cannot:
# PHPUnit turns value="true" into "1", which the OpenTelemetry SDK rejects and reads as false.
# Each job has its own concurrency group, per pull request (or ref) and PHP version, so a new push
# cancels the run it supersedes everywhere but on main. The caller's workflow needs none.
name: databases

on:
  workflow_call:
    inputs:
      php:
        description: The PHP versions, as a JSON array
        type: string
        default: '["8.4", "8.5"]'
      script:
        description: The package's script that runs the suite against one connection
        type: string
        default: bin/run-database-tests.sh

permissions:
  contents: read

jobs:
  mysql_57:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: databases-mysql_57-${{ github.event.pull_request.number || github.ref }}-${{ matrix.php }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-start-period 30s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: ghcr.io/ipsocode/hypervel/ci-alpine:${{ matrix.php }}-latest

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php) }}

    name: MySQL 5.7 (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ipsocode/hypervel-packages-ci/tests/install@5f71faf98453d4bbd336f0047aa854cfef78ca66
        with:
          php: ${{ matrix.php }}

      - name: Execute integration tests
        env:
          SCRIPT: ${{ inputs.script }}
          DB_HOST: mysql
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: ${SCRIPT} mysql

