name: Pages build
description: Build a package's src/docs/ into a GitHub Pages artifact at a tag or commit. Check the repository out with all tags first. Deploying stays in the calling workflow.
inputs:
  ref:
    description: Tag or commit whose src/docs/ to publish. Empty is the latest v* tag.
    default: ''
  base-path:
    description: The site's base path. Empty asks actions/configure-pages, which needs Pages enabled on the repository.
    default: ''
outputs:
  sha:
    description: The commit that was built.
    value: ${{ steps.ref.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Choose the commit
      id: ref
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        ref="${REF:-$(git tag --list 'v*' --sort=-v:refname | head -n 1)}"
        [ -n "${ref}" ] || {
          echo "::error::No v* tag to publish the docs of. Pass a ref, or release first."
          exit 1
        }
        sha=$(git rev-parse --verify "${ref}^{commit}")
        git checkout --quiet --detach "${sha}"
        echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
        echo "Publishing src/docs/ at ${ref} (${sha})" >> "${GITHUB_STEP_SUMMARY}"

    - name: Configure Pages
      id: pages
      if: inputs.base-path == ''
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Stage the pages
      shell: bash
      env:
        SHA: ${{ steps.ref.outputs.sha }}
        BASE_PATH: ${{ inputs.base-path || steps.pages.outputs.base_path }}
      run: |
        set -euo pipefail
        [ -f src/docs/index.md ] || {
          echo "::error::src/docs/index.md is missing at ${SHA}. The site starts from it."
          exit 1
        }
        python3 -I "${{ github.action_path }}/stage.py"

    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      with:
        source: ./site-src
        destination: ./_site

    - name: Check the template syntax survived
      shell: bash
      run: |
        set -euo pipefail
        python3 -I "${{ github.action_path }}/check.py"

    - name: Upload the site
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./_site
