name: Install
description: Install a package's dependencies with Composer, keeping Composer's downloads and the tools' caches (tests/.cache) between runs.
inputs:
  php:
    description: The PHP version of the job, such as 8.4. It only keys the caches.
    required: true
  restore-only:
    description: Restore Composer's downloads without saving them, and skip the tests/.cache cache. For a run that must not write caches, such as the upstream check.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Cache Composer downloads
      if: inputs.restore-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/composer-cache
        key: composer-${{ inputs.php }}-${{ hashFiles('composer.json') }}
        restore-keys: composer-${{ inputs.php }}-

    - name: Restore Composer downloads
      if: inputs.restore-only == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/composer-cache
        key: composer-${{ inputs.php }}-${{ hashFiles('composer.json') }}
        restore-keys: composer-${{ inputs.php }}-

    - name: Install dependencies
      shell: bash
      env:
        COMPOSER_CACHE_DIR: /tmp/composer-cache
        COMPOSER_MEMORY_LIMIT: '-1'
        COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        composer update --prefer-dist --no-interaction --optimize-autoloader

    - name: Cache tests/.cache
      if: inputs.restore-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/.cache
        key: tests-cache-${{ inputs.php }}-${{ hashFiles('composer.json', 'phpstan.neon', 'phpunit.xml', '.php-cs-fixer.dist.php') }}-${{ github.sha }}
        restore-keys: tests-cache-${{ inputs.php }}-${{ hashFiles('composer.json', 'phpstan.neon', 'phpunit.xml', '.php-cs-fixer.dist.php') }}-
